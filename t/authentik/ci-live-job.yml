# The live job for .github/workflows/ci.yml.
#
# It does not live there yet: the deploy credential this repository is pushed
# with has no `workflow` scope, so a push that touches .github/workflows is
# refused by GitHub. Paste the block below under `jobs:` in
# .github/workflows/ci.yml, and add `workflow_dispatch:` under `on:`.
#
# What it does: start the throwaway authentik from this directory with
# generated secrets, wait for it to be ready, run t/90-live-authentik.t
# against it, and throw it away again. It needs the synchronous distribution
# checked out next door, because this one depends on it and the test harness
# shares a file with it. The image is about a gigabyte and the instance needs
# two minutes to come up, so it runs on main and on demand, never on a pull
# request.

  live:
    # a real authentik, started here and thrown away again
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the synchronous distribution
        uses: actions/checkout@v4
        with:
          repository: Getty/p5-www-authentik
          path: p5-www-authentik
      - name: Fix safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Write the secrets for the throwaway instance
        working-directory: t/authentik
        run: |
          {
            echo "AUTHENTIK_TAG=2026.8.3"
            echo "AUTHENTIK_PORT=9000"
            echo "PG_PASS=$(openssl rand -hex 24)"
            echo "AUTHENTIK_SECRET_KEY=$(openssl rand -base64 60 | tr -d '\n')"
            echo "AUTHENTIK_BOOTSTRAP_PASSWORD=$(openssl rand -hex 20)"
            echo "AUTHENTIK_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)"
            echo "AUTHENTIK_BOOTSTRAP_EMAIL=akadmin@example.org"
          } > .env
      - name: Start authentik
        working-directory: t/authentik
        run: docker compose up -d
      - name: Wait for it to be ready
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/-/health/ready/)" = 200 ]; then
              echo "ready after $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "authentik did not come up"; docker compose -f t/authentik/docker-compose.yml logs --tail 50; exit 1
      - name: Install the dependencies
        run: |
          curl -sL https://cpanmin.us | perl - --sudo --notest App::cpanminus
          sudo cpanm --notest --installdeps ./p5-www-authentik
          sudo cpanm --notest --installdeps .
      - name: Run the live suite
        run: |
          set -a; . t/authentik/.env; set +a
          PERL5LIB="$GITHUB_WORKSPACE/p5-www-authentik/lib" \
          AUTHENTIK_LIVE_TEST=1 \
          AUTHENTIK_URL=http://127.0.0.1:9000 \
          AUTHENTIK_TOKEN="$AUTHENTIK_BOOTSTRAP_TOKEN" \
          prove -lvr t/90-live-authentik.t
      - name: authentik's logs, when something went wrong
        if: failure()
        working-directory: t/authentik
        run: docker compose logs --tail 200
      - name: Throw it away
        if: always()
        working-directory: t/authentik
        run: docker compose down -v
